services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: velaluna
      POSTGRES_USER: velaluna
      POSTGRES_PASSWORD: velaluna
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velaluna"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BACKEND_URL=http://backend:3000
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./content:/content
    environment:
      - PORT=3000
      - CONTENT_PATH=/content
      - FRONTEND_URL=http://localhost:5173
      - DATABASE_URL=postgresql://velaluna:velaluna@postgres:5432/velaluna
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
